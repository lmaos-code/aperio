services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: kc-adm
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U kc-adm -d keycloak
      interval: 5s
      timeout: 3s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: kc-adm 
      KC_DB_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - 8081:8080
    command: start-dev --import-realm
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aperio.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - 8080:80
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
  sync:
    image: ghcr.io/belphemur/obsidian-headless-sync-docker:latest
    environment:
      OBSIDIAN_AUTH_TOKEN: ${OBSIDIAN_AUTH_TOKEN}
      VAULT_NAME: ${VAULT_NAME:-Obsidian}
      VAULT_HOST_PATH: ${VAULT_HOST_PATH:-./dev/vault}
      VAULT_PATH: /vault
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DEVICE_NAME: aperio-dev
      CONFLICT_STRATEGY: merge
      SYNC_MODE: bidirectional
    volumes:
      - ../dev/vault:/vault
    profiles:
      - sync
volumes:
  pgdata:
  pgadmin:
