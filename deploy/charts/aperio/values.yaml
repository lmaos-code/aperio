# Default values for Aperio

# -- Number of replicas (requires RWX storage for multiple; sync always runs as single replica)
replicaCount: 1

image:
  # -- Aperio container image repository
  repository: ghcr.io/lmaos-code/aperio
  # -- Aperio container image tag (defaults to .Chart.version)
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

syncImage:
  # -- Obsidian Headless Sync container image repository
  repository: ghcr.io/belphemur/obsidian-headless-sync-docker
  # -- Image tag
  tag: latest
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the release name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations for the service account
  annotations: {}
  # -- Service account name (generated if not set)
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Kubernetes Service type
  type: ClusterIP
  # -- Service port
  port: 80
  # -- Container target port (should match MCP_PORT)
  targetPort: 3000

# -- Ingress configuration (legacy, prefer httpRoute)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: aperio.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: aperio-tls
  #    hosts:
  #      - aperio.local

# -- HTTPRoute configuration (Gateway API)
httpRoute:
  enabled: false
  # -- Gateway name (must exist in the cluster)
  gatewayName: ""
  # -- Gateway namespace (defaults to release namespace)
  gatewayNamespace: ""
  # -- Parent refs (alternative to gatewayName for complex routing)
  parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-system
  #   sectionName: https
  # -- Hostnames to match
  hostnames: []
  # - aperio.example.com
  # -- HTTPRoute rules
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ""  # defaults to release service
          port: 80

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- PersistentVolumeClaim for vault storage (RWX required for aperio + sync)
persistence:
  enabled: true
  # -- Storage class name (uses default if not set)
  storageClass: ""
  # -- PVC size
  size: 10Gi

# -- Aperio application configuration
aperio:
  # -- MCP server port
  mcpPort: 3000
  # -- Public URL for OAuth metadata (derived from request Host if not set)
  publicUrl: ""
  # -- Vault directory inside the container
  vaultDir: /vault
  # -- Log level (trace, debug, info, warn, error)
  logLevel: info
  # -- Sync health check method (none, file, heartbeat, kubernetes)
  syncCheck: file
  # -- MCP realm for WWW-Authenticate header
  mcpRealm: mcp
  # -- Allowed hosts for MCP connections (prevents DNS rebinding attacks)
  allowedHosts: []

# -- OIDC authentication configuration (always required)
auth:
  # -- OIDC discovery URL (direct value)
  discoveryUrl: ""
  # -- OIDC discovery URL from existing Secret
  discoveryUrlRef:
    # -- Secret name
    secretName: ""
    # -- Key in the Secret
    key: "oidc-discovery-url"
  # -- Required audience claim
  audience: ""
  # -- Required issuer claim
  requiredIssuer: ""
  # -- Required claims (comma-separated, e.g. "sub,email")
  requiredClaims: ""

# -- Obsidian Headless Sync configuration (always deployed)
sync:
  # -- Remote Obsidian Sync vault name (exact, case-sensitive)
  vaultName: ""
  # -- Sync mode: bidirectional, pull-only, mirror-remote
  syncMode: "bidirectional"
  # -- UID that will own synced files
  puid: "1000"
  # -- GID that will own synced files
  pgid: "1000"
  # -- Obsidian sync server URL
  serverUrl: ""
  # -- Vault path inside the container
  vaultPath: "/vault"
  # -- Authentication token (direct value)
  token: ""
  # -- Authentication token from existing Secret
  tokenRef:
    # -- Secret name
    secretName: ""
    # -- Key in the Secret
    key: "token"
  # -- Vault encryption password (for E2E encrypted vaults, optional)
  vaultPassword: ""
  # -- Vault encryption password from existing Secret
  vaultPasswordRef:
    # -- Secret name
    secretName: ""
    # -- Key in the Secret
    key: "VAULT_PASSWORD"
  # -- Device name
  deviceName: "aperio-k8s"
  # -- Device ID (generate a UUID if not set)
  deviceId: ""
  # -- Resource limits and requests for sync container
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

# -- Additional environment variables for Aperio
extraEnv: []

# -- Additional environment variables for sync container
syncExtraEnv: []
