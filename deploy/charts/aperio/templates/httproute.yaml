{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aperio.fullname" . }}
  labels:
    {{- include "aperio.labels" . | nindent 4 }}
spec:
  {{- if .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- if kindIs "slice" .Values.httpRoute.parentRefs }}
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
    {{- else }}
    - {{- toYaml .Values.httpRoute.parentRefs | nindent 6 }}
    {{- end }}
  {{- else if .Values.httpRoute.gatewayName }}
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayName }}
      {{- if .Values.httpRoute.gatewayNamespace }}
      namespace: {{ .Values.httpRoute.gatewayNamespace }}
      {{- end }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- if kindIs "slice" . }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $i, $rule := .Values.httpRoute.rules }}
    - matches:
        {{- toYaml $rule.matches | nindent 8 }}
      backendRefs:
        {{- range $rule.backendRefs }}
        - name: {{ .name | default (include "aperio.fullname" $) }}
          port: {{ .port | default $.Values.service.port }}
        {{- end }}
    {{- end }}
{{- end }}
