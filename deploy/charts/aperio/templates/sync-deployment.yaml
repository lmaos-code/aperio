apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aperio.fullname" . }}-sync
  labels:
    {{- include "aperio.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aperio.syncSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aperio.syncSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aperio.serviceAccountName" . }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      terminationGracePeriodSeconds: 30
      containers:
        - name: sync
          image: {{ include "aperio.syncImage" . }}
          imagePullPolicy: {{ .Values.syncImage.pullPolicy }}
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          env:
            - name: VAULT_PATH
              value: {{ .Values.sync.vaultPath | quote }}
            - name: VAULT_NAME
              value: {{ .Values.sync.vaultName | quote }}
            - name: SYNC_MODE
              value: {{ .Values.sync.syncMode | quote }}
            - name: PUID
              value: {{ .Values.sync.puid | quote }}
            - name: PGID
              value: {{ .Values.sync.pgid | quote }}
            {{- if .Values.sync.serverUrl }}
            - name: SERVER_URL
              value: {{ .Values.sync.serverUrl | quote }}
            {{- end }}
            {{- if .Values.sync.deviceName }}
            - name: DEVICE_NAME
              value: {{ .Values.sync.deviceName | quote }}
            {{- end }}
            {{- if .Values.sync.deviceId }}
            - name: DEVICE_ID
              value: {{ .Values.sync.deviceId | quote }}
            {{- end }}
            {{- if or .Values.sync.token .Values.sync.tokenRef.secretName }}
            - name: OBSIDIAN_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.sync.tokenRef.secretName }}
                  name: {{ .Values.sync.tokenRef.secretName }}
                  key: {{ .Values.sync.tokenRef.key }}
                  {{- else }}
                  name: {{ include "aperio.secretName" . }}
                  key: sync-token
                  {{- end }}
            {{- end }}
            {{- if or .Values.sync.vaultPassword .Values.sync.vaultPasswordRef.secretName }}
            - name: VAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.sync.vaultPasswordRef.secretName }}
                  name: {{ .Values.sync.vaultPasswordRef.secretName }}
                  key: {{ .Values.sync.vaultPasswordRef.key }}
                  {{- else }}
                  name: {{ include "aperio.secretName" . }}
                  key: vault-password
                  {{- end }}
            {{- end }}
            {{- with .Values.syncExtraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.sync.vaultPath | default "/vault" }}
          {{- with .Values.sync.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: {{ include "aperio.pvcName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
